  https: https://github.com/denistka/navitrack-config-app
  account: denistka@gmail.com
  branch: main

rebuild_strategy:
  phase_1: |
    Deep-analyze DUT app (screens, flows, domain) → intel/DUT-FUNCTIONALITY.md
  phase_2: |
    Scaffold empty shell from mobile-apps: keep Tauri/Vite/UI kit/logo/branding;
    strip fleet screens, map, tracking stores/APIs. Placeholder home + company logo. DONE.
  phase_3: |
    Port DUT functionality via epics E1–E11 / sprints S01–S12 (gate: CLOSED — done 2026-09-18).
    See intel/EPICS.md. RC: S12-INVARIANTS.md / sprints/S12/RC-NOTES.md.
  phase_4: |
    Post-RC epic E12 (S13–S15, gate: LOCKED): native BLE/OS, Advanced stubs, Graduation→DUT write.
    See intel/POST-RC.md.
  deltas_vs_mobile_apps:
    - package_manager: bun (mobile-apps = pnpm)
    - testing: fintech-dashboard pyramid + HARD mandate intel/TEST-COVERAGE-MANDATE.md
    - code_quality: post-sprint review + refactor per intel/CODE-QUALITY-MANDATE.md

