project:
  name: NaviTrack
  version: 1.0.0
  description: Fleet tracking mobile application — React 19 + Tauri 2 (iOS/Android).
  stack:
    - react19
    - typescript
    - tauri2
    - rust
    - firebase-fcm
    - biometrics
    - tailwindcss
    - zustand
    - leaflet
  ui_stack_ref: null
  ui_stack_package: null
  ui_design_docs:
    - README.md#ui--design-sprints
    - totem/core/DESIGN_SPRINT_GUIDE.md

paths:
  code: ../../../../../navitrack/navitrack-mobile-apps
  react_app: ../../../../../navitrack/navitrack-mobile-apps
  history: ../prompt-machine
  intel: ./intel

testing:
  mandatory: true
  applies_to: every new change in paths.code
  spec: ./intel/TESTING.ti
  commands:
    - pnpm test
    - pnpm test:e2e
  rule: >
    A change is not done until it has an automated test and pnpm test passes.
    User-journey changes also require pnpm test:e2e. Do not add behavior without
    a colocated src/**/*.test.ts(x) or an updated existing test.

guardians:
  default:
    - ROOT
    - PM
    - QA
    - CODEMAP_QUALITY_ADVISOR
    - DEVOPS
    - ARCHITECT
  stack_adapters:
    - FRONTEND_DEV
    - RUST_DEV
    - MOBILE_TAURI
